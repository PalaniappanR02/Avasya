services:
  db:
    image: postgis/postgis:16-3.4
    container_name: avasya-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: avasya
      POSTGRES_USER: avasya
      POSTGRES_PASSWORD: avasya
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avasya -d avasya"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
